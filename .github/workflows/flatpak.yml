# Gera o Flatpak (Linux) do Meus Gastos.
# - Manual (Actions → Flatpak → Run workflow) ou a cada push que muda o código: baixe em "Artifacts".
# - Ao publicar uma release: o arquivo MeusGastos-linux.flatpak é anexado a ela.
# Os clientes OAuth vêm dos secrets OAUTH_COMPUTADOR_JSON e OAUTH_TV_JSON (conteúdo dos JSON);
# sem eles o workflow falha em vez de gerar um Flatpak sem login do Google.
name: Flatpak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "ui/**", "Cargo.*", "build.rs", "flatpak/**", ".github/workflows/flatpak.yml"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Lista as crates do Cargo.lock como fontes do Flatpak (baixadas uma vez e reaproveitadas pelo cache).
  # Roda fora do container do Flatpak, que não tem gerenciador de pacotes para o Python.
  cargo-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar cargo-sources.json
        run: |
          pip install 'aiohttp>=3.9.5,<4' 'tomlkit>=0.13.3,<1' 'PyYAML>=6.0.2,<7'
          curl -sSfL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          python "$RUNNER_TEMP/flatpak-cargo-generator.py" Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: cargo-sources.json
          retention-days: 1

  flatpak:
    needs: cargo-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Clientes OAuth (secrets)
        env:
          COMPUTADOR: ${{ secrets.OAUTH_COMPUTADOR_JSON }}
          TV: ${{ secrets.OAUTH_TV_JSON }}
        # Sem os dois clientes o Flatpak não teria login do Google: o build para aqui.
        run: |
          if [ -z "$COMPUTADOR" ] || [ -z "$TV" ]; then
            echo "::error::Cadastre os secrets OAUTH_COMPUTADOR_JSON e OAUTH_TV_JSON (veja PUBLICAR.md). Build cancelado."
            exit 1
          fi
          mkdir -p oauth
          printf '%s' "$COMPUTADOR" > oauth/computador.json
          printf '%s' "$TV" > oauth/tv.json
          # O conteúdo (tipo do cliente, client_id) é validado pelo build.rs durante a compilação.

      - name: Versão no metainfo
        # Garante que a versão do Cargo.toml aparece nas releases do AppStream (lojas de apps do Linux).
        run: |
          VERSAO=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          META=flatpak/br.com.meusgastos.metainfo.xml
          if ! grep -q "<release version=\"$VERSAO\"" "$META"; then
            sed -i "s|<releases>|<releases>\n    <release version=\"$VERSAO\" date=\"$(date -u +%F)\"/>|" "$META"
            echo "::warning::Release $VERSAO adicionada ao metainfo só neste build; registre-a em $META."
          fi

      - name: Dependências Rust (cargo-sources.json)
        uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: flatpak

      # Fixado num commit (não em @master): o job tem permissão de escrita e os clientes OAuth no disco.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: MeusGastos-linux.flatpak
          manifest-path: flatpak/br.com.meusgastos.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

      - name: Anexar à release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "${{ github.event.release.tag_name }}" MeusGastos-linux.flatpak --clobber
