# Flatpak do Meus Gastos (versão para computador, Linux).
# Gerado pelo GitHub Actions (.github/workflows/flatpak.yml); para gerar localmente num Linux:
#   flatpak install flathub org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08
#   python3 flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json
#     (script de https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo)
#   flatpak-builder --user --install --force-clean build-dir flatpak/br.com.meusgastos.yml
id: br.com.meusgastos
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gastos-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Sincronização com o Google Drive e login (o retorno do login usa 127.0.0.1)
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # cargo-sources.json grava aqui o vendor das dependências e o config que aponta para ele.
    CARGO_HOME: /run/build/meusgastos/cargo
modules:
  - name: meusgastos
    buildsystem: simple
    build-commands:
      # Sem rede: as crates vêm de cargo-sources.json (baixadas e guardadas no cache do flatpak-builder).
      - cargo --offline build --release --locked --bin gastos-desktop
      - install -Dm755 target/release/gastos-desktop /app/bin/gastos-desktop
      - install -Dm644 flatpak/br.com.meusgastos.desktop /app/share/applications/br.com.meusgastos.desktop
      - install -Dm644 flatpak/br.com.meusgastos.metainfo.xml /app/share/metainfo/br.com.meusgastos.metainfo.xml
      - install -Dm644 flatpak/icons/128.png /app/share/icons/hicolor/128x128/apps/br.com.meusgastos.png
      - install -Dm644 flatpak/icons/256.png /app/share/icons/hicolor/256x256/apps/br.com.meusgastos.png
      - install -Dm644 flatpak/icons/512.png /app/share/icons/hicolor/512x512/apps/br.com.meusgastos.png
    sources:
      - type: dir
        path: ..
        # Só o necessário para compilar o app de computador (nada de site, Android, git ou chave de assinatura).
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - .git
          - .github
          - .claude
          - docs
          - res
          - keystore
          - build-web.ps1
          - flatpak/cargo-sources.json
      - cargo-sources.json
