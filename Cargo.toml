[package]
name = "gastos"
version = "0.1.1"
edition = "2021"
description = "Controle de gastos mensais por categoria (Rust + Slint: Android, computador e web)"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gastos-desktop"
path = "src/main.rs"

[dependencies]
slint = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasmbind: no navegador, a data/hora vem do Date do JavaScript
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
getrandom = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

# Android e computador: HTTP com TLS em Rust puro (rustls) e login OAuth com PKCE
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"

# Computador: janela de escolher arquivo
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.15"

# Navegador (WebAssembly): ponte com o JavaScript, fetch, localStorage e IndexedDB
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "Window", "console", "Document", "Element", "HtmlElement", "HtmlInputElement", "Location", "History",
    "Storage", "File", "FileList", "Blob", "FileReader", "Event", "EventTarget",
    "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore",
    "IdbTransaction", "IdbTransactionMode", "DomStringList",
    "Request", "RequestInit", "RequestMode", "Response", "Headers", "UrlSearchParams",
] }

[build-dependencies]
slint-build = "1.18"
# Ícone do .exe no Windows
embed-resource = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# ---------- Configuração do APK (cargo-apk) ----------
[package.metadata.android]
package = "br.com.meusgastos"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Ícone do app (res/mipmap-*/ic_launcher.png, gerado a partir de assets/logo-completo.jpg)
resources = "res"

# Assinatura do APK de release: defina CARGO_APK_RELEASE_KEYSTORE e
# CARGO_APK_RELEASE_KEYSTORE_PASSWORD (veja PUBLICAR.md). Nada de senha neste arquivo.

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
label = "Meus Gastos"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard"
orientation = "portrait"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
